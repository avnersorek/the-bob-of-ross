<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>The Bob of Ross - Painting with Bob</title>
  </head>
  <body>
    <div id="app">
      <canvas id="canvas"></canvas>
  <div id="video-window" class="floating hidden">
    <div id="video-header">Video</div>
    <div id="video-container"></div>
    <div id="video-controls" class="video-controls" aria-label="Video transport controls">
      <div class="video-controls-row">
        <button id="seek-back" class="video-btn" type="button" aria-label="Seek back 10 seconds">-10s</button>
        <button id="play-pause" class="video-btn" type="button" aria-label="Play or pause">Play</button>
        <button id="seek-fwd" class="video-btn" type="button" aria-label="Seek forward 10 seconds">+10s</button>
      </div>
      <div class="video-controls-row video-controls-row-secondary">
        <input id="seek-bar" class="video-seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="Seek position">
        <div id="time-readout" class="time-readout" aria-label="Current time and duration">0:00 / 0:00</div>
      </div>
    </div>
  </div>
      <div id="control-bar"></div>
      <div id="tool-hud" class="hidden"></div>
      <div id="toast-container"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
